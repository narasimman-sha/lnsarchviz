<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Interior</title>
    <style>
        body {
            padding: 0;
            margin: 0;
            box-sizing: content-box;   
        }
        #tour-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 0;
            margin: 0;
            box-sizing: content-box;
        }
        .ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            padding: 0;
            margin: 0;
            box-sizing: content-box;
        }
        .ui-container * {
            pointer-events: all;
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: "Roboto", sans-serif;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        .ui-container img {
            display: block;
            width: 100%;
        }
        .ui-container button {
            display: block;
            width: 100%;
        }
        #timetrigger {
            position: absolute;
            top: 5px;
            left: 50%;
            width: 200px;
            transform: translate(-50%, 0%);
            z-index: 3;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3%;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }
        #timetrigger svg {
            fill: white;
            height: 20px;
            transition: 0.35s;
        }
        #daytrigger {
            flex: 1 1 45%;
            color: white;
            background: transparent;
            border: 0;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
            gap: 3px;
            font-size: 1.1rem;
            padding: 8px;
            font-weight: 600;
        }
        
        #daytrigger:hover {
            background-color: #dddddd5a;
            color: #353535;
        }
        
        #nighttrigger {
            flex: 1 1 50%;
            color: white;
            background: transparent;
            border: 0;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.4s;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
            gap: 3px;
            font-size: 1.1rem;
            padding: 8px 12px 8px 8px; 
            font-weight: 600;
        }
        #nighttrigger:hover {
            background-color: #dddddd5a;
            color: #353535;
        }
        .tactive {
            color: #1c1c1c !important;
            background-color: #edf1f4 !important;
            
        }
        .tactive svg {
            fill: #1c1c1c !important;
        }
        #option-ui {
            position: absolute;
            right: 12px;
            top: 12px;
            display: flex;
            flex-flow: column wrap;
            gap: 6px;
        }
        .full-screen {
            cursor: pointer;
            transition: 0.35s;
            padding: 3px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .full-screen:hover .fs-enter svg {
            transform: scale(1.1);
            fill: #525252;
        }
        .full-screen:hover .fs-exit svg {
            transform: scale(0.85);
            fill: #525252;
        }
        .fs-enter svg {
            transition: 0.35s;
        }
        .fs-exit svg {
            transition: 0.35s;
        }
        .full-screen .fs-exit {
            display: none;
        }
        .full-screen.is-fullscreen .fs-enter {
            display: none;
        }
        .full-screen.is-fullscreen .fs-exit {
            display: block;
        }
        .share-content {
            cursor: pointer;
            transition: 0.35s;
            padding: 3px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 4px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
        }
        .share-content svg {
            transition: 0.35s;
        }
        .share-content:hover .sharing svg {
            fill: #525252;
            transform: scale(1.1);
        }
        #changable-ui {
            position: absolute;
            bottom: 5px;

            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50px;
            cursor: pointer;
            transition: 0.4s;
            font-size: 1.1rem;
            padding: 10px 8px 8px 8px;
            font-weight: 600;
            box-shadow: 3px 3px 6px rgba(88, 88, 88, 0.5);
        }
        .plan {
            justify-self: center;
            align-self: center;
            text-align: center;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            font-size: 1.1rem;
            border-radius: 15px;
            width: 100%;
            height: 100%;
        }
        .posistion {
            display: none;
            top: 0px;
            left: 0px;
            position: absolute;
        }

        .side:open::picker(select) {

        .side:not(:open)::picker(select) {
            opacity: 0;
            transform: translateY(25px) scale(0.95);
        }
        @starting-style {
            .side:open::picker(select) {
                opacity: 0;
                transform: translateY(25px) scale(0.95);
            }
        }
        .side option {
            width: 80px;
            border-radius: 10px;
            transition: 0.35s;
            gap: 3px;
            transition: 0.35s;
        }
        
        .side option:hover {
            background-color: rgba(255, 255, 255, 0.5);
            transform: scale(1.1);
        }
        .side option:checked {
            background-color: rgba(255, 255, 255, 0.75);

        .booknow {

        }
        .booknow:hover {
            transform: scale(1.1);
            box-shadow: 4px 4px 8px rgba(168, 60, 60, 0.35);
        }
        .book {
            color: white;
            justify-self: center;
            align-self: center;
            text-align: center;
            align-items: center;
            cursor: pointer;
            font-weight: 500;
            font-size: 1.1rem;
            border-radius: 15px;
            width: 100%;
            height: 100%;
        }
        
        #floating-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        /* .present {
            transform: scale(0.5);
            opacity: 1;
            transition: 0.35s;
        } */
        #floating-ui.present {
            transform: scale(1);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            visibility: visible;
            opacity: 1;
            cursor: default;
        }

            padding: 1px;

            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) scale(0.5);
            transition: 0.5s;
        }
        .float-content.contentpresent {
            transform: translate(-50%, -50%) scale(1);
        }

        function initAframeComponents() {
            canvasEl = sceneEl.canvas;

            let retries = 0;

            const waitForZoomComponent = setInterval(() => {
                if (cameraEl && cameraEl.components['smooth-fov-zoom']) {
                    zoomComp = cameraEl.components['smooth-fov-zoom'];
                    console.log("Zoom component found:", zoomComp);
                    clearInterval(waitForZoomComponent);
                    attachHotspotListeners();  // Start listening only when ready

                    clearInterval(waitForZoomComponent);
                }

                    let imgLoader = new Image();

                    imgLoader.src = innerurl;

                            easing: 'easeInQuad'
                        });
                    });
                }
                if(hp.classList.contains(currentposistion)) {
                    hp.setAttribute('visible', true);
                    hp.setAttribute('scale', '1 1 1');
                    console.log(hp, 'called');
                    let insidehp = hp.querySelectorAll('.view');
                    insidehp.forEach(function(ihp) {
                        let originalScale = ihp.getAttribute('data-scale') || '1 1 1';
                        ihp.removeAttribute('animation__scale'); // Clear previous animations
                        ihp.setAttribute('animation__scale', {
                            property: 'scale',
                            to: originalScale,
                            dur: 800, // Animation duration in milliseconds
                            easing: 'easeOutQuad'
                        });
                    });
                }
            });
            previousPosition = currentposistion;
        }
        outerDomeTexture(outerurl);
        innerDomeTexture(innerurl);
        outerdome.setAttribute('rotation', `0 ${currentside} 0`);
        console.log(outerurl, innerurl);
    </script>
    <script>
        AFRAME.registerComponent('hotspot-behavior', {
            init: function () {
                const el = this.el;
                //console.log(el)
                const label = el.querySelector('.label-popup');
                if (!label) return;

                this.label = label;
                this.camEl = document.querySelector('[camera]');
                this.vector = new THREE.Vector3();
                
                this.screenHalfWidth = window.innerWidth / 2;
                this.screenMinX = window.innerWidth * 0.25;
                this.screenMaxX = window.innerWidth * 0.75;

                el.dataset.isHovered = "false";
                this.isLabelVisible = false;
                this.frameCounter = 0;
                this.calculateFrequency = 4;

                el.addEventListener('mouseenter', () => {
                    el.dataset.isHovered = "true";
                    //label.setAttribute('visible', true);
                    this.setLabelVisible(true);
                })
                el.addEventListener('mouseleave', () => {
                    el.dataset.isHovered = "false";
                    //label.setAttribute('visible', false);
                })
                window.addEventListener('resize', () => {
                    this.screenHalfWidth = window.innerWidth / 2;
                    this.screenMinX = window.innerWidth * 0.25;
                    this.screenMaxX = window.innerWidth * 0.75;
                });
                
            },
            setLabelVisible: function (visible) {
                if (this.isLabelVisible !== visible) {
                    this.isLabelVisible = visible;
                    
                    //this.label.setAttribute('visible', visible);
                    // const scale = visible ? '1 1 1' : '0 0 0';
                    // this.label.setAttribute('scale', scale);
                    if (visible) {
                        console.log(visible)
                        this.label.emit('lpscalingbegin');
                    } else {
                        console.log(visible)
                        this.label.emit('lpscalingend');
                    }
                }
            },
            tick: function () {

                if (!this.camEl || !this.label) return;

                if (this.frameCounter++ % this.calculateFrequency !== 0) {
                    return;
                }

                const sceneEl = this.el.sceneEl;
                if (!sceneEl || !sceneEl.camera) return;

                const camera = sceneEl.camera;

                // Get world position of the hotspot
                this.el.object3D.lookAt(this.camEl.object3D.position);
                this.el.object3D.getWorldPosition(this.vector);

                // Project 3D coordinate to 2D screen space (-1 to +1)
                this.vector.project(camera);

                // Convert to pixel coordinates based on actual window size
                const screenX = (this.vector.x * this.screenHalfWidth) + this.screenHalfWidth;
                const isInCenter = this.vector.z < 1 && screenX >= this.screenMinX && screenX <= this.screenMaxX;
                const isHovered = this.el.dataset.isHovered === "true";

                if (isInCenter || isHovered) {
                    this.setLabelVisible(true);
                } else {
                    this.setLabelVisible(false);
                }
            }
        });
        AFRAME.registerComponent('smooth-fov-zoom', {
            schema: {
                minFov: {default: 25},
                maxFov: {default: 82.5},
                zoomSpeed: {default: 3}, 
                pinchSpeed: {default: 0.125}, 
                damping: {default: /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ? 0.3 : 0.15},

                // Landscape Settings (Desktop & Horizontal Mobile)
                landscapeFov: {default: 57},
                landscapeRotateSpeed: {default: -0.175},

                // Portrait Settings (Vertical Mobile)
                portraitFov: {default: 82.5},
                portraitZoomTarget: {default: 70},
                portraitRotateSpeed: {default: -0.4}, // Faster to compensate for narrow screen
                
                // Speed when zoomed all the way in
                minRotateSpeed: {default: -0.09}      
            },
            init: function () {
                // 1. Detect initial orientation
                this.isPortrait = window.innerWidth < window.innerHeight;
                this.activeBaseFov = this.isPortrait ? this.data.portraitFov : this.data.landscapeFov;
                this.activeBaseSpeed = this.isPortrait ? this.data.portraitRotateSpeed : this.data.landscapeRotateSpeed;
            
                this.targetFov = this.activeBaseFov;
                this.currentFov = this.targetFov;
                this.initialPinchDistance = null;
                this.onZoomComplete = null;

                this.lastAppliedFov = this.currentFov;
                this.lastAppliedSpeed = this.activeBaseSpeed;

                this.el.setAttribute('camera', 'fov', this.currentFov);
                // 2. Bind methods
                this.onWheel = this.onWheel.bind(this);
                this.onTouchMove = this.onTouchMove.bind(this);
                this.onTouchEnd = this.onTouchEnd.bind(this);
                this.onResize = this.onResize.bind(this);
            
                // 3. Add Listeners
                window.addEventListener('wheel', this.onWheel, {passive: false});
                window.addEventListener('touchmove', this.onTouchMove, {passive: false});
                window.addEventListener('touchend', this.onTouchEnd);
                window.addEventListener('resize', this.onResize);
            
                // 4. Set initial speed on load
                this.updateControlsSpeed(this.activeBaseSpeed);
            },
            zoomTo: function (fovValue, callback) {
                this.targetFov = fovValue;
                this.clampFov();
                this.onZoomComplete = callback || null;
            },
            onResize: function () {
                let newIsPortrait = window.innerWidth < window.innerHeight;

                // Only trigger if the orientation actually flipped
            if (newIsPortrait !== this.isPortrait) {
                // Figure out what percentage zoomed in we currently are (0 = fully zoomed out, 1 = fully zoomed in)
                let zoomPercent = (this.activeBaseFov - this.targetFov) / (this.activeBaseFov - this.data.minFov);
                zoomPercent = Math.max(0, Math.min(1, zoomPercent)); 
                
                // Update orientation states
                this.isPortrait = newIsPortrait;
                this.activeBaseFov = this.isPortrait ? this.data.portraitFov : this.data.landscapeFov;
                this.activeBaseSpeed = this.isPortrait ? this.data.portraitRotateSpeed : this.data.landscapeRotateSpeed;
                
                // Maintain the same zoom percentage on the new FOV!
                this.targetFov = this.activeBaseFov - (zoomPercent * (this.activeBaseFov - this.data.minFov));
                this.clampFov();
                }
            },
            onWheel: function (e) {
                this.targetFov += Math.sign(e.deltaY) * this.data.zoomSpeed;
                this.clampFov();
            },
            onTouchMove: function (e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
                if (e.touches.length === 2) {
                    let dist = Math.hypot(
                        e.touches[0].pageX - e.touches[1].pageX,
                        e.touches[0].pageY - e.touches[1].pageY
                    );
                    if (this.initialPinchDistance === null) {
                    this.initialPinchDistance = dist;
                    } else {
                        let delta = this.initialPinchDistance - dist;
                        this.targetFov += delta * this.data.pinchSpeed;
                        this.initialPinchDistance = dist;
                        this.clampFov();
                    }
                }
            },
            onTouchEnd: function () {
                this.initialPinchDistance = null;
            },
            clampFov: function () {
                // Prevent zooming out further than the active default FOV or the absolute max
                let maxBound = Math.max(this.data.maxFov, this.activeBaseFov);
                this.targetFov = Math.max(this.data.minFov, Math.min(maxBound, this.targetFov));
            },
            updateControlsSpeed: function (speed) {
                // Helper function to apply speeds to orbit-controls
                this.el.setAttribute('orbit-controls', 'rotateSpeed', speed);
                this.el.setAttribute('orbit-controls', 'panSpeed', speed);
            },
            tick: function () {
                if (Math.abs(this.targetFov - this.currentFov) > 0.05) {
                    this.currentFov += (this.targetFov - this.currentFov) * this.data.damping;
        
                    // Only update DOM if change exceeds threshold
                    if (Math.abs(this.lastAppliedFov - this.currentFov) > 0.1) {
                        this.el.setAttribute('camera', 'fov', this.currentFov);
                        this.lastAppliedFov = this.currentFov;
                    }
                    
                // Blend between the active base speed and the minimum speed based on zoom percentage
                let zoomPercent = (this.activeBaseFov - this.currentFov) / (this.activeBaseFov - this.data.minFov);
                zoomPercent = Math.max(0, Math.min(1, zoomPercent)); 
                    
                let dynamicSpeed = this.activeBaseSpeed - (zoomPercent * (this.activeBaseSpeed - this.data.minRotateSpeed));

                if (Math.abs(this.lastAppliedSpeed - dynamicSpeed) > 0.001) {
                    this.updateControlsSpeed(dynamicSpeed);
                    this.lastAppliedSpeed = dynamicSpeed;
                }
                //this.updateControlsSpeed(dynamicSpeed);
                } else if (this.onZoomComplete) {
                    let cb = this.onZoomComplete;
                    this.onZoomComplete = null;
                    cb();
                }
            },
            remove: function () {
                window.removeEventListener('wheel', this.onWheel);
                window.removeEventListener('touchmove', this.onTouchMove);
                window.removeEventListener('touchend', this.onTouchEnd);
                window.removeEventListener('resize', this.onResize);
            }
        });
    </script>
